# ═══════════════════════════════════════════════════
# tmux — void
# ═══════════════════════════════════════════════════

# --- Terminal ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g terminal-features[0] "xterm*:clipboard:ccolour:cstyle:focus:title:extkeys"
set -g extended-keys always
set -g extended-keys-format csi-u
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on

# --- Base ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g repeat-time 400
set -g mouse on
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -g set-titles on
set -g set-titles-string "#S · #W"

# --- Quiet ---
set -g bell-action none
set -g visual-bell off
set -g visual-activity off
set -g monitor-activity on

unbind-key -q -n S-Enter
bind-key -n C-j send-keys -H 1b 5b 31 33 3b 32 75

# ═══════════════════════════════════════════════════
# Palette (void)
#   bg #0a0a0a · fg #c9c9c9 · dim #4a4a4a · line #262626
#   accent #5fb56a · warn #c9a85c · err #cf5c5c
# ═══════════════════════════════════════════════════

# --- Status bar: top, transparent, one line ---
set -g status on
set -g status-position top
set -g status-style "bg=default,fg=#c9c9c9"
set -g status-justify left

set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#5fb56a],#[fg=#4a4a4a]}● #[fg=#c9c9c9,bold]#S #[fg=#262626]│ "

set -g status-right-length 60
set -g status-right "#[fg=#c9a85c]#{?window_zoomed_flag,⤢ zoom ,}#[fg=#4a4a4a]%H:%M"

set -g window-status-format "#[fg=#4a4a4a]#I #W "
set -g window-status-current-format "#[fg=#5fb56a]#I #[fg=#ededed,bold]#W "
set -g window-status-activity-style "fg=#c9a85c"
set -g window-status-bell-style "fg=#cf5c5c"
set -g window-status-separator " "

# --- Panes ---
set -g pane-border-style "fg=#262626"
set -g pane-active-border-style "fg=#4a4a4a"
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status off
set -g display-panes-active-colour "#5fb56a"
set -g display-panes-colour "#4a4a4a"

# --- Messages / popups / copy ---
set -g message-style "fg=#5fb56a,bg=default"
set -g message-command-style "fg=#c9a85c,bg=default"
set -g popup-style "bg=default,fg=#c9c9c9"
set -g popup-border-style "fg=#262626"
set -g popup-border-lines single
set -g clock-mode-colour "#5fb56a"
setw -g mode-keys vi
setw -g mode-style "fg=#ededed,bg=#262626"

# ═══════════════════════════════════════════════════
# Keybinds (prefix: ctrl+space)
# ═══════════════════════════════════════════════════
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Pane nav (vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (repeatable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3
bind z resize-pane -Z

# Windows
bind c new-window -c "#{pane_current_path}"
bind & kill-window
bind x kill-pane
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -r Tab last-window

# Sessions
bind N command-prompt -p "new session:" "new-session -s '%%'"
bind S choose-session -Z
bind X confirm-before -p "kill session '#S'? (y/n)" "kill-session"
bind s display-popup -E -w 50% -h 40% \
  "tmux list-sessions -F '#S' | fzf --prompt 'session ❯ ' --no-info | xargs -r tmux switch-client -t"

# Popups: lazygit · btop · scratch shell
bind g display-popup -E -w 92% -h 92% -d "#{pane_current_path}" "lazygit"
bind b display-popup -E -w 92% -h 92% "btop"
bind t display-popup -E -w 70% -h 60% -d "#{pane_current_path}"

# Copy mode (vi)
bind [ copy-mode
bind ] paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# Help
bind ? display-popup -w 82% -h 82% -E "less -R ~/.config/tmux/cheatsheet.txt"
bind / display-popup -w 82% -h 82% -E "tmux list-keys -N | less -R"

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"
